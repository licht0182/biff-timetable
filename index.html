<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="부산국제영화제 개인 상영 시간표" />
    <title>BIFF Timetable</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const originalFetch = window.fetch.bind(window)
        window.fetch = (input, init = {}) => {
          const rawUrl = typeof input === 'string' ? input : input.url
          if (rawUrl.includes('screenings.json')) {
            const separator = rawUrl.includes('?') ? '&' : '?'
            const freshUrl = `${rawUrl}${separator}v=2025-test-20260908-1`
            return originalFetch(freshUrl, { ...init, cache: 'no-store' })
          }
          return originalFetch(input, init)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
