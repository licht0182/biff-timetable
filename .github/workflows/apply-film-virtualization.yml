name: Apply film list virtualization

on:
  push:
    branches:
      - perf/virtualize-film-list
    paths:
      - .github/workflows/apply-film-virtualization.yml

permissions:
  contents: write

jobs:
  optimize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply virtualization refactor
        run: |
          python scripts/apply-film-virtualization.py
          python scripts/fix-film-scroll-restore.py
      - name: Install dependencies
        run: npm install
      - name: Validate screening data
        run: npm run validate:data
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify virtualization, scroll restore, and menu performance
        run: node scripts/verify-film-virtualization.mjs
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "Virtualize film list and preserve search state"
          git push origin HEAD:perf/virtualize-film-list
