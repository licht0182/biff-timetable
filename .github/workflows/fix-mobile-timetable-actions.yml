name: Fix mobile timetable actions

on:
  push:
    branches:
      - fix/mobile-timetable-actions
    paths:
      - .github/workflows/fix-mobile-timetable-actions.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-timetable-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch layout and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old_actions = '''          <div className="timetable-actions enhanced-timetable-actions">
            <div><p>선택한 회차의 종료시간과 브라우저 크기에 맞춰 시간표 범위를 자동 조정합니다.</p><span className="booking-summary">예매 완료 {bookedCount} · 예정 {plannedCount}</span></div>
'''
          new_actions = '''          <div className="timetable-actions enhanced-timetable-actions">
            <div><span className="booking-summary">예매 완료 {bookedCount} · 예정 {plannedCount}</span></div>
'''
          assert old_actions in text
          text = text.replace(old_actions, new_actions, 1)

          old_note = '''          {userSettings.showTransferWarnings && <p className="transfer-note">이동 여유 경고 기준: 동일 상영관 {userSettings.sameVenueMinutes}분 · 같은 상영관군 {userSettings.sameClusterMinutes}분 · 다른 상영관 {userSettings.differentVenueMinutes}분.</p>}
'''
          new_note = '''          <div className="timetable-notes">
            <p className="timetable-range-note">시간표 범위는 선택한 회차의 종료시간과 브라우저 크기에 맞춰 자동 조정됩니다.</p>
            {userSettings.showTransferWarnings && <p className="transfer-note">이동 여유 경고 기준: 동일 상영관 {userSettings.sameVenueMinutes}분 · 같은 상영관군 {userSettings.sameClusterMinutes}분 · 다른 상영관 {userSettings.differentVenueMinutes}분.</p>}
          </div>
'''
          assert old_note in text
          text = text.replace(old_note, new_note, 1)
          app.write_text(text)

          css = Path('src/features.css')
          styles = css.read_text()
          old_desktop = '''.enhanced-timetable-actions>div:first-child{display:grid;gap:2px}
.booking-summary{font-size:10px;color:#777;font-weight:700}
.timetable-action-buttons{display:flex;align-items:center;gap:5px;min-width:0}
.backup-menu{position:relative}
.backup-menu>summary{list-style:none;border:1px solid #e2e2e2;border-radius:5px;background:#fff;color:#777;font-size:10px;font-weight:700;padding:5px 8px;cursor:pointer;user-select:none}
'''
          new_desktop = '''.enhanced-timetable-actions>div:first-child{display:flex;align-items:center;min-width:max-content}
.booking-summary{font-size:10px;color:#777;font-weight:700;white-space:nowrap}
.timetable-action-buttons{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:nowrap}
.timetable-action-buttons>*{flex:0 0 auto}
.timetable-action-buttons>button,.backup-menu>summary{min-height:30px;padding:0 9px;font-size:10px;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.backup-menu{position:relative}
.backup-menu>summary{list-style:none;border:1px solid #e2e2e2;border-radius:5px;background:#fff;color:#777;font-weight:700;cursor:pointer;user-select:none}
'''
          assert old_desktop in styles
          styles = styles.replace(old_desktop, new_desktop, 1)

          old_note_css = '''.transfer-note{margin:5px 2px 0;color:#9a9a9a;font-size:9px;line-height:1.3}
'''
          new_note_css = '''.timetable-notes{display:flex;flex-wrap:wrap;gap:2px 8px;margin:5px 2px 0}
.timetable-notes p{margin:0;color:#9a9a9a;font-size:9px;line-height:1.3}
'''
          assert old_note_css in styles
          styles = styles.replace(old_note_css, new_note_css, 1)

          old_mobile = '''  .enhanced-timetable-actions{align-items:flex-end}
  .enhanced-timetable-actions>div:first-child p{font-size:8px}
  .booking-summary{font-size:8px}
  .timetable-action-buttons{gap:3px;overflow:visible}
  .timetable-action-buttons>button,.backup-menu>summary{font-size:8px;padding:4px 5px}
  .backup-menu>div{min-width:92px}
  .transfer-note{font-size:7px}
'''
          new_mobile = '''  .enhanced-timetable-actions{align-items:center;gap:8px}
  .booking-summary{font-size:9px}
  .timetable-action-buttons{gap:4px;overflow:visible}
  .timetable-action-buttons>button,.backup-menu>summary{min-height:30px;font-size:10px;padding:0 8px}
  .backup-menu>div{min-width:92px}
  .timetable-notes{gap:2px 6px;margin-top:5px}
  .timetable-notes p{font-size:7px}
'''
          assert old_mobile in styles
          styles = styles.replace(old_mobile, new_mobile, 1)
          css.write_text(styles)
          PY
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify iPhone action layout
        run: |
          cat > /tmp/mobile-actions-test.mjs <<'JS'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3 })
          const page = await context.newPage()
          const errors = []
          page.on('pageerror', (error) => errors.push(String(error)))
          await page.goto('http://127.0.0.1:4173/biff-timetable/', { waitUntil: 'networkidle' })
          await page.locator('.film-card').first().waitFor({ state: 'visible' })

          const addButtons = page.getByRole('button', { name: '+ 추가' })
          for (let i = 0; i < 3; i += 1) await addButtons.nth(i).click()
          await page.getByRole('button', { name: '내 시간표' }).click()
          await page.locator('.timetable-action-buttons .png-export-trigger').waitFor({ state: 'visible' })

          const labels = await page.locator('.timetable-action-buttons > button, .timetable-action-buttons > .backup-menu > summary').allTextContents()
          const metrics = await page.locator('.timetable-action-buttons > button, .timetable-action-buttons > .backup-menu > summary').evaluateAll((nodes) => nodes.map((node) => {
            const style = getComputedStyle(node)
            const rect = node.getBoundingClientRect()
            return { text: node.textContent, fontSize: style.fontSize, whiteSpace: style.whiteSpace, width: rect.width, height: rect.height, scrollHeight: node.scrollHeight, clientHeight: node.clientHeight }
          }))
          const fontSizes = new Set(metrics.map((item) => item.fontSize))
          if (labels.length !== 4) throw new Error(`expected 4 actions, got ${labels.length}: ${labels.join(', ')}`)
          if (fontSizes.size !== 1 || !fontSizes.has('10px')) throw new Error(`inconsistent button fonts: ${JSON.stringify(metrics)}`)
          if (metrics.some((item) => item.whiteSpace !== 'nowrap')) throw new Error(`button wrapping enabled: ${JSON.stringify(metrics)}`)
          if (metrics.some((item) => item.scrollHeight > item.clientHeight + 1)) throw new Error(`button text wrapped/clipped: ${JSON.stringify(metrics)}`)

          const topAutoText = await page.locator('.timetable-actions').getByText('자동 조정').count()
          const bottomAutoText = await page.locator('.timetable-notes').getByText('자동 조정').count()
          if (topAutoText !== 0 || bottomAutoText !== 1) throw new Error(`auto-adjust text placement invalid: top=${topAutoText}, bottom=${bottomAutoText}`)

          const actionBox = await page.locator('.timetable-actions').boundingBox()
          const buttonBox = await page.locator('.timetable-action-buttons').boundingBox()
          if (!actionBox || !buttonBox || buttonBox.x + buttonBox.width > 390) throw new Error(`actions overflow viewport: ${JSON.stringify({ actionBox, buttonBox })}`)
          if (errors.length) throw new Error(`page errors: ${errors.join('\n')}`)
          console.log(JSON.stringify({ labels, metrics, actionBox, buttonBox }, null, 2))
          await browser.close()
          JS
          node /tmp/mobile-actions-test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features.css
          git commit -m "Fix mobile timetable action layout"
          git push origin HEAD:fix/mobile-timetable-actions
