name: Verify BIFF Timetable

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate screening data
        run: npm run validate:data

      - name: Build
        run: npm run build
