name: Bootstrap npm lockfile

on:
  push:
    branches: [ci/e2e-regression]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/e2e-regression
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/bootstrap-lock.yml
          git commit -m "Add reproducible npm lockfile"
          git push origin HEAD:ci/e2e-regression
