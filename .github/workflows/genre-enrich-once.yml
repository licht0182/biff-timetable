name: One-time genre enrichment

on:
  push:
    branches: [feature/film-genres]

permissions:
  contents: write

jobs:
  enrich:
    if: ${{ !contains(github.event.head_commit.message, '[genre-enriched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/film-genres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply genre schema and UI patches
        run: node scripts/apply-genre-ui.mjs
      - name: Collect genres from BIFF archive pages
        run: node scripts/enrich-genres.mjs
      - name: Validate data
        run: node scripts/validate-screenings.mjs
      - name: Build
        run: npm ci && npm run build
      - name: Commit enriched database and UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenings.json src scripts/validate-screenings.mjs package.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Populate BIFF genres and show them in the app [genre-enriched]"
          git push origin HEAD:feature/film-genres
