name: Generate BIFF 2025 full timetable

on:
  push:
    branches: [research/full-2025-import]
    paths:
      - 'scripts/import-biff-2025.mjs'
      - 'scripts/check-biff-2025-codes.mjs'
      - '.github/workflows/generate-biff-2025.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate full 2025 dataset
        run: node scripts/import-biff-2025.mjs
      - name: Reconcile official screening codes
        run: node scripts/check-biff-2025-codes.mjs
      - name: Replace test database on research branch
        run: cp generated-screenings.json public/screenings.json
      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenings.json
          if git diff --cached --quiet; then
            echo "Dataset is already current."
          else
            git commit -m "Load complete BIFF 2025 Korean timetable"
            git push
          fi
      - name: Upload generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: biff-2025-full-dataset
          path: |
            generated-screenings.json
            generated-report.json
