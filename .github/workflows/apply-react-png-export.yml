name: Apply React PNG export

on:
  push:
    branches:
      - refactor/react-png-export
    paths:
      - .github/workflows/apply-react-png-export.yml
      - scripts/apply-react-png-export.py
      - scripts/verify-transfer-buffer.ts
      - scripts/verify-react-png-export.mjs

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/react-png-export
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: python scripts/apply-react-png-export.py
      - name: Install dependencies
        run: npm install
      - name: Validate data
        run: npm run validate:data
      - name: Build
        run: npm run build
      - name: Verify shared transfer calculations
        run: |
          npm install --no-save tsx@4
          npx tsx scripts/verify-transfer-buffer.ts
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Browser regressions
        run: node scripts/verify-react-png-export.mjs
      - name: Commit application changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/main.tsx src/png-export.ts
          if git diff --cached --quiet; then
            echo 'No application changes to commit.'
          else
            git commit -m 'Move PNG export trigger into React'
            git push origin HEAD:refactor/react-png-export
          fi
