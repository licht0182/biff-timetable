name: Patch dynamic timetable range

on:
  push:
    branches:
      - feature/dynamic-timeline-range
    paths:
      - scripts/patch-dynamic-timeline.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-timeline-range
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/patch-dynamic-timeline.py
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - name: Commit dynamic timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/png-export.ts src/png-export.css
          git commit -m "Use dynamic timetable end range"
          git push origin HEAD:feature/dynamic-timeline-range
