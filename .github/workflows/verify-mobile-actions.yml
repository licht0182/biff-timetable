name: Verify mobile timetable actions

on:
  push:
    branches:
      - fix/mobile-timetable-actions
    paths:
      - src/features.css
      - scripts/verify-mobile-actions.mjs
      - .github/workflows/verify-mobile-actions.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify mobile controls
        run: node scripts/verify-mobile-actions.mjs
