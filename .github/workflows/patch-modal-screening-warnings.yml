name: Patch modal screening warnings

on:
  push:
    branches:
      - feat/modal-screening-warnings
    paths:
      - .github/workflows/patch-modal-screening-warnings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modal-screening-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/patch-modal-screening-warnings.py
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features.css
          git commit -m "Show scheduling warnings in film detail modal"
          git push origin HEAD:feat/modal-screening-warnings
