name: Patch modal screening warnings

on:
  push:
    branches:
      - feat/modal-screening-warnings
    paths:
      - .github/workflows/patch-modal-screening-warnings.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modal-screening-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch modal warning rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          start_marker = '          <div className="modal-screenings">{detailFilm.screenings.map((screening) => {'
          end_marker = '          <div className="modal-footer">'
          start = app.find(start_marker)
          end = app.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('modal screenings markers not found')
          new = '''          <div className="modal-screenings">{detailFilm.screenings.map((screening) => {
            const isSelected = selected.includes(screening.id)
            const isCurrentScreening = screening.id === detailScreeningId
            const hasConflict = conflicts(detailFilm, screening)
            const travel = transitionWarning(detailFilm, screening)
            const rowNote = hasConflict
              ? '선택한 회차와 시간이 겹칩니다.'
              : travel
                ? `${travel.routeLabel ? `${travel.routeLabel} · ` : ''}이동 여유 ${travel.gap}분 · 필요 ${travel.buffer}분`
                : ''
            const rowNoteTitle = travel?.transferDetail ? `${rowNote}\\n${travel.transferDetail}` : rowNote || undefined
            const rowClassName = [
              isCurrentScreening ? 'current-screening' : '',
              hasConflict ? 'conflict' : '',
              travel ? 'travel-warning' : '',
            ].filter(Boolean).join(' ')
            return <div className={rowClassName} key={screening.id}><div><strong>{screening.code ? `[${screening.code}] ` : ''}{formatDate(screening.date)} {screening.start}{isCurrentScreening && <em className="current-screening-badge">현재 회차</em>}</strong><span>{screening.venue} · {screening.start}–{endLabel(detailFilm, screening)}{screening.gv ? ' · GV' : ''}</span>{rowNote && <small className={`modal-screening-note ${travel ? 'travel-text' : ''}`} title={rowNoteTitle}>{rowNote}</small>}</div><button className={isSelected ? 'selected' : ''} onClick={() => toggle(detailFilm, screening)}>{isSelected ? '선택됨' : '+ 추가'}</button></div>
          })}</div>
'''
          app_path.write_text(app[:start] + new + app[end:])

          css_path = Path('src/features.css')
          css = css_path.read_text()
          marker = '/* modal-screening-warnings */'
          addition = '''\n/* modal-screening-warnings */\n.modal-screenings>div.conflict{background:#fff8f7;box-shadow:inset 3px 0 0 var(--accent);padding-left:8px;padding-right:8px}\n.modal-screenings>div.travel-warning:not(.conflict){box-shadow:inset 3px 0 0 #e3a321;padding-left:8px;padding-right:8px}\n.modal-screening-note{display:block;margin-top:2px;font-size:9px!important;font-weight:700;line-height:1.35;color:var(--accent);white-space:normal!important;overflow:visible!important;text-overflow:clip!important}\n.modal-screening-note.travel-text{color:#9a6b10}\n'''
          if marker not in css:
              css_path.write_text(css + addition)
          PY
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify modal conflict and travel warnings
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import { chromium } from 'playwright'

          const data = JSON.parse(fs.readFileSync('public/screenings.json', 'utf8'))
          const items = data.films.flatMap(film => film.screenings.map(screening => ({ film, screening })))
          const toMinutes = time => { const [h, m] = time.split(':').map(Number); return h * 60 + m }
          const endMinutes = item => {
            const start = toMinutes(item.screening.start)
            if (item.screening.end) {
              let end = toMinutes(item.screening.end)
              if (end <= start) end += 1440
              return end
            }
            return start + (item.film.runtime ?? 120)
          }

          let conflictPair = null
          outerConflict: for (const a of items) for (const b of items) {
            if (a.screening.id === b.screening.id || a.screening.date !== b.screening.date || a.film.id === b.film.id) continue
            const overlap = toMinutes(a.screening.start) < endMinutes(b) && toMinutes(b.screening.start) < endMinutes(a)
            if (overlap) { conflictPair = [a, b]; break outerConflict }
          }
          assert.ok(conflictPair, 'No conflict pair found')

          let travelPair = null
          outerTravel: for (const a of items) for (const b of items) {
            if (a.screening.id === b.screening.id || a.screening.date !== b.screening.date || a.film.id === b.film.id) continue
            if (a.screening.venue !== b.screening.venue) continue
            const gap = toMinutes(b.screening.start) - endMinutes(a)
            if (gap >= 0 && gap < 120) { travelPair = [a, b]; break outerTravel }
          }
          assert.ok(travelPair, 'No same-venue travel pair found')

          const browser = await chromium.launch({ headless: true })
          const errors = []
          try {
            async function openDetail(selectedId, targetFilm, settings = null) {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } })
              const page = await context.newPage()
              page.on('pageerror', error => errors.push(String(error)))
              await page.addInitScript(({ selectedId, settings }) => {
                localStorage.setItem('biff-timetable:selected-screenings:v1', JSON.stringify([selectedId]))
                localStorage.setItem('biff-timetable:ticket-status:v1', JSON.stringify({ [selectedId]: 'planned' }))
                if (settings) localStorage.setItem('biff-timetable:user-settings:v1', JSON.stringify(settings))
              }, { selectedId, settings })
              await page.goto('http://127.0.0.1:4173/biff-timetable/', { waitUntil: 'networkidle' })
              await page.locator('.controls input').fill(targetFilm.title)
              await page.locator('.detail-button').first().click()
              await page.locator('.film-modal').waitFor({ state: 'visible' })
              return { context, page }
            }

            const [conflictSelected, conflictTarget] = conflictPair
            {
              const { context, page } = await openDetail(conflictSelected.screening.id, conflictTarget.film)
              const note = page.locator('.modal-screening-note', { hasText: '선택한 회차와 시간이 겹칩니다.' })
              assert.ok(await note.count() > 0, 'Conflict warning missing from film detail modal')
              const row = note.locator('xpath=ancestor::div[contains(@class,"conflict")]')
              assert.ok(await row.count() > 0, 'Conflict row class missing')
              await context.close()
            }

            const [travelSelected, travelTarget] = travelPair
            {
              const settings = {
                sameVenueMinutes: 120,
                sameClusterMinutes: 10,
                differentVenueMinutes: 30,
                showTransferWarnings: true,
                showVenueInTimetable: true,
                showBookingStatusInTimetable: true,
              }
              const { context, page } = await openDetail(travelSelected.screening.id, travelTarget.film, settings)
              const note = page.locator('.modal-screening-note', { hasText: '동일 상영관 · 이동 여유' })
              assert.ok(await note.count() > 0, 'Travel warning missing from film detail modal')
              assert.ok((await note.first().textContent()).includes('필요 120분'), 'Travel buffer detail missing')
              await context.close()
            }

            assert.deepEqual(errors, [])
            console.log(JSON.stringify({
              conflict: `${conflictSelected.film.title} -> ${conflictTarget.film.title}`,
              travel: `${travelSelected.film.title} -> ${travelTarget.film.title}`,
              errors,
            }, null, 2))
          } finally {
            await browser.close()
          }
          NODE
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features.css
          git commit -m "Show scheduling warnings in film detail modal"
          git push origin HEAD:feat/modal-screening-warnings
