name: One-time timetable modal booking status patch

on:
  push:
    branches: [feature/timetable-modal-ticket-status]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[modal-status-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/timetable-modal-ticket-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-timetable-modal-status.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test --project=chromium
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features.css tests/e2e/smoke.spec.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add booking status control to timetable detail [modal-status-patched]"
          git push origin HEAD:feature/timetable-modal-ticket-status
