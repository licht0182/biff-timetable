name: Repair selection state handling

on:
  push:
    branches:
      - fix/selection-deselect-crash
    paths:
      - .github/workflows/fix-selection-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/selection-deselect-crash
      - name: Patch React selection state handling
        run: python scripts/fix-selection-state.py
      - name: Remove obsolete DOM mutation helpers
        run: git rm -f src/ticket-defaults.ts src/ui-consistency.ts
      - name: Verify
        run: |
          npm install
          npm run validate:data
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git commit -m "Fix selected screening cancellation crash"
          git push origin HEAD:fix/selection-deselect-crash
