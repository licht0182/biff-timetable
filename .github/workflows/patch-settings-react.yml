name: Patch React settings ownership

on:
  push:
    branches:
      - debug/deselect-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Move timetable settings into React state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug/deselect-e2e
      - run: python scripts/patch-settings-react.py
      - run: git rm -f src/settings.ts
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/settings.css src/timetable-display.ts src/png-export.ts
          git commit -m "Move timetable settings into React state"
          git push origin HEAD:debug/deselect-e2e
