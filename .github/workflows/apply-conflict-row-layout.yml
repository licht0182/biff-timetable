name: Apply conflict detail and row layout

on:
  push:
    branches:
      - fix/conflict-details-row-layout
    paths:
      - .github/workflows/apply-conflict-row-layout.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply app changes
        run: |
          python scripts/apply-conflict-row-layout.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles.css')
          text = path.read_text()
          text = text.replace('.screening-row:last-child{border-bottom:0}', '.screening-row:last-child{border-bottom:1px solid transparent}', 1)
          path.write_text(text)
          PY
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify conflict detail and row layout
        run: node scripts/verify-conflict-row-layout.mjs
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css src/features.css
          git commit -m "Detail conflicting sessions and unify screening row layout"
          git push origin HEAD:fix/conflict-details-row-layout
