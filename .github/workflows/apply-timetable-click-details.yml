name: Apply timetable click details

on:
  push:
    branches:
      - feature/timetable-click-details
    paths:
      - .github/workflows/apply-timetable-click-details.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply timetable detail changes
        run: python scripts/apply-timetable-click-details.py
      - run: npm install
      - run: npm run validate:data
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/biff-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biff-timetable/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/biff-preview.log
          exit 1
      - name: Verify timetable detail interactions
        run: node scripts/verify-timetable-click-details.mjs
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/timetable-readonly.css
          git commit -m "Open timetable details from screening blocks"
          git push origin HEAD:feature/timetable-click-details

# Verification rerun after correcting outside-click simulation.
