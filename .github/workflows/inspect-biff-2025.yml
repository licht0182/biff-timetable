name: Inspect BIFF 2025 source

on:
  push:
    branches: [research/full-2025-import]
    paths:
      - 'scripts/inspect-biff-2025.mjs'
      - '.github/workflows/inspect-biff-2025.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/inspect-biff-2025.mjs
